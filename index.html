<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>房產財務精算師 Premium</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #007AFF;
            --primary-gradient: linear-gradient(135deg, #007AFF, #5856D6);
            --bg-body: #F2F2F7;
            --surface: #FFFFFF;
            --text-main: #1D1D1F;
            --radius-l: 24px;
            --nav-height: 75px;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); margin: 0; padding-top: 40px; padding-bottom: calc(var(--nav-height) + 40px); overflow-x: hidden; }
        
        /* --- 📣 跑馬燈樣式 --- */
        .marquee-container { position: fixed; top: 0; left: 0; width: 100%; height: 40px; background: #FFF9E6; border-bottom: 1px solid #FFE58F; z-index: 1000; overflow: hidden; display: flex; align-items: center; }
        .marquee-text { white-space: nowrap; animation: marquee 20s linear infinite; color: #D46B08; font-weight: 800; font-size: 0.9rem; cursor: pointer; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* --- 鎖定與啟動 --- */
        #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary-gradient); z-index: 11000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s; }
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #FFF; z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
        .lock-content { background: white; padding: 40px; border-radius: 28px; text-align: center; width: 100%; max-width: 360px; }
        .lock-input { width: 100%; padding: 18px; font-size: 1.2rem; text-align: center; border: 2px solid #F2F2F7; border-radius: 18px; margin-bottom: 20px; font-weight: bold; color: var(--primary); outline: none; }
        .lock-btn { background: var(--primary); color: white; width: 100%; padding: 18px; border: none; border-radius: 18px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }

        header { background: var(--primary-gradient); color: white; height: 60px; display: flex; align-items: center; justify-content: center; position: sticky; top: 40px; z-index: 100; }
        h1 { font-size: 1rem; margin: 0; }

        .container { width: 100%; padding: 20px 15px; margin: 0 auto; max-width: 650px; }
        .card { background: white; border-radius: var(--radius-l); padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 25px; }
        
        /* --- 分級標籤 --- */
        .tier-badge { background: #000; color: #FFF; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; vertical-align: middle; margin-left: 5px; }
        .tier-VIP { background: #FFD700; color: #000; }
        .tier-VVIP { background: linear-gradient(45deg, #FFD700, #FFA500); color: #FFF; }

        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; color: #444; }
        input, select { width: 100%; padding: 14px; border: 1.5px solid #E5E5EA; border-radius: 14px; font-size: 1rem; margin-bottom: 10px; background: #FAFAFA; }
        
        .btn-group { display: grid; grid-template-columns: 1fr; gap: 10px; }
        button { padding: 16px; border-radius: 16px; border: none; font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--primary); color: white; }
        .btn-outline { background: white; border: 2.5px solid var(--primary); color: var(--primary); }

        /* --- 📂 客戶存儲列表 --- */
        .client-list { margin-top: 15px; border-top: 1px solid #EEE; padding-top: 15px; }
        .client-item { display: flex; justify-content: space-between; align-items: center; background: #F9F9FB; padding: 12px; border-radius: 12px; margin-bottom: 8px; font-size: 0.9rem; }
        .limit-info { font-size: 0.75rem; color: #8E8E93; text-align: center; margin-bottom: 10px; }

        /* --- 報表彈出 --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20000; overflow-y: auto; flex-direction: column; align-items: center; padding: 40px 15px; }
        .share-card { width: 100%; max-width: 400px; background: white; border-radius: 35px; overflow: hidden; flex-shrink: 0; }
        .share-header { background: var(--primary-gradient); padding: 30px; color: white; text-align: center; }
        .share-body { padding: 25px; color: #1D1D1F; }
        .share-hero-box { background: #F2F2F7; border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .share-hero-val { font-size: 2.3rem; font-weight: 900; color: var(--primary); }
        .share-detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #EEE; font-size: 0.95rem; }
        .share-footer { background: #F9F9FB; padding: 20px; display: flex; align-items: center; gap: 15px; border-top: 1px solid #EEE; }
        .share-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-top: 1px solid #EEE; display: flex; justify-content: space-around; align-items: center; z-index: 999; }
        .nav-item { flex: 1; text-align: center; color: #8E8E93; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        #adminPanel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 420px; background: white; border-radius: 28px; padding: 30px; z-index: 30000; display: none; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="splash-screen"><img src="image_24505e.png" style="width:100px;"></div>

<div class="marquee-container" id="marqueeArea" style="display:none;">
    <div class="marquee-text" id="marqueeText" onclick="window.open(marqueeLink)">加載中精選案源...</div>
</div>

<div id="lock-screen"><div class="lock-content"><h3>房產精算師 PREMIUM</h3><input type="text" id="passcodeInput" class="lock-input" placeholder="請輸入註冊手機"><button onclick="checkCloudAuth()" class="lock-btn">驗證開通</button></div></div>

<header><h1>房產財務精算師 <span id="userTierDisplay" class="tier-badge"></span></h1></header>

<div class="container">
    <div id="tab-sell" class="tab-content active">
        <div class="card">
            <h2>💰 售屋獲利精算</h2>
            <div class="grid">
                <input type="text" id="clientNameSell" placeholder="客戶稱呼 (例如：陳小姐)">
                <input type="date" id="sell_buyDate">
                <input type="number" id="sell_buyP" placeholder="買入價格 (萬)">
                <input type="number" id="sell_sellP" placeholder="預計賣價 (萬)">
                <input type="number" id="sell_loanL" placeholder="房貸餘額 (萬)">
            </div>
            <div class="btn-group">
                <button onclick="doSell()" class="btn-main">📊 開始計算</button>
                <button onclick="saveClientData('sell')" class="btn-outline">📂 儲存至雲端資料夾</button>
            </div>
            <div id="areaS" class="res-area">
                <div class="res-card"><div style="opacity:0.8; font-size:0.9rem;">稅後實拿</div><div class="res-val" id="outC">0 萬</div></div>
                <button onclick="showShareCard('sell')" class="btn-outline" style="margin-top:15px; width:100%;">✨ 生成專業圖卡</button>
            </div>
        </div>
    </div>

    <div id="tab-buy" class="tab-content">
        <div class="card">
            <h2>🏠 購屋能力評估</h2>
            <div class="mode-toggle"><div id="btnModeB" class="toggle-btn active" onclick="setBuyMode('budget')">用預算推</div><div id="btnModeT" class="toggle-btn" onclick="setBuyMode('target')">由總價推</div></div>
            <div class="grid">
                <input type="text" id="clientNameBuy" placeholder="客戶稱呼 (例如：林先生)">
                <div id="groupBudget">
                    <input type="number" id="buy_cash" placeholder="可用現金 (萬)">
                    <input type="number" id="buy_monthly" placeholder="每月還款預算 (萬)">
                </div>
                <div id="groupTarget" style="display:none;"><input type="number" id="buy_target" placeholder="房屋目標總價 (萬)"></div>
                <select id="buy_rate"><option value="2.5">2.5 %</option><option value="2.75">2.75 %</option><option value="3.0">3.0 %</option></select>
                <select id="buy_grace"><option value="0">無寬限期</option><option value="3">3 年</option><option value="5">5 年</option></select>
            </div>
            <div class="btn-group">
                <button onclick="doBuy()" class="btn-main">🔍 進行財務評估</button>
                <button onclick="saveClientData('buy')" class="btn-outline">📂 儲存至雲端資料夾</button>
            </div>
            <div id="areaB" class="res-area">
                <div class="res-card"><div id="resBuyLabel" style="opacity:0.8;">建議總價</div><div class="res-val" id="resBuyVal">0 萬</div></div>
                <button onclick="showShareCard('buy')" class="btn-outline" style="margin-top:15px; width:100%;">✨ 生成專業圖卡</button>
            </div>
        </div>
    </div>

    <div id="tab-folder" class="tab-content">
        <div class="card">
            <h2>📂 我的雲端儲存夾</h2>
            <div class="limit-info" id="limitDisplay">儲存上限：0 / 5</div>
            <div id="clientList" class="client-list"></div>
        </div>
    </div>

    <div id="tab-settings" class="tab-content">
        <div class="card">
            <h2>👤 品牌設定</h2>
            <div class="grid">
                <input type="text" id="agentName" placeholder="姓名">
                <input type="text" id="agentPhone" placeholder="電話">
                <button onclick="saveProfile()" class="btn-main">💾 儲存形象</button>
                <button onclick="triggerAdmin()" class="btn-outline" style="margin-top:40px; border:none; color:#EEE;">系統管理</button>
            </div>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('tab-sell', this)">💰 售屋</div>
    <div class="nav-item" onclick="switchTab('tab-buy', this)">🏠 購屋</div>
    <div class="nav-item" onclick="switchTab('tab-folder', this)">📂 資料夾</div>
    <div class="nav-item" onclick="switchTab('tab-settings', this)">👤 設定</div>
</nav>

<div id="adminPanel">
    <h3>🔑 雲端管理員</h3>
    <div class="grid">
        <input type="text" id="admin_phone" placeholder="開通手機">
        <input type="text" id="admin_name" placeholder="開通姓名">
        <select id="admin_tier"><option value="普通用戶">普通用戶 (5個)</option><option value="VIP用戶">VIP用戶 (100個)</option><option value="VVIP用戶">VVIP用戶 (無限)</option></select>
        <button onclick="addUser()" class="btn-main">確認開通</button>
        <hr>
        <label>跑馬燈內容</label>
        <input type="text" id="admin_msg" placeholder="輸入 A 件好房訊息">
        <input type="text" id="admin_link" placeholder="點擊跳轉網址">
        <button onclick="updateSystem()" class="btn-main">更新公告</button>
    </div>
    <button onclick="document.getElementById('adminPanel').style.display='none'" style="margin-top:10px; width:100%;">關閉</button>
</div>

<div id="shareCardModal" class="modal">
    <div id="captureArea" class="share-card">
        <div class="share-header">
            <div id="cardClientName" style="font-size:1.2rem; font-weight:800; margin-bottom:5px;"></div>
            <div class="share-title">不動產財務分析報告</div>
        </div>
        <div class="share-body" id="cardBodyContent"></div>
        <div class="share-footer">
            <div class="share-info"><div class="share-name" id="cardAgentName">房產顧問</div><div id="cardAgentPhone">--</div></div>
        </div>
    </div>
    <button onclick="shareAsImage()" class="btn-main" style="margin-top:20px; width:300px;">📲 直接分享至 Line / Threads</button>
    <button onclick="document.getElementById('shareCardModal').style.display='none'" class="modal-close-btn">關閉</button>
</div>

<script>
    // --- Firebase 配置 ---
    const firebaseConfig = {
        apiKey: "AIzaSyDv3-2psunhNzjbTIY38L8jbVf2wmO5WEw",
        authDomain: "simbaapp-62d40.firebaseapp.com",
        databaseURL: "https://simbaapp-62d40-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "simbaapp-62d40",
        storageBucket: "simbaapp-62d40.firebasestorage.app",
        messagingSenderId: "579331559085",
        appId: "1:579331559085:web:4d6e4ab3605f124ae1c024",
        measurementId: "G-QJFE2LZYCB"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let userData = null, marqueeLink = "";
    let sellResult = null, buyResult = null, currentBuyMode = 'budget';

    // --- 1. 啟動與權限 ---
    async function checkCloudAuth() {
        const phone = document.getElementById('passcodeInput').value.trim();
        db.ref('users/' + phone).once('value', (s) => {
            const d = s.val();
            if (d && d.status === 'active') {
                localStorage.setItem('simba_phone', phone);
                location.reload();
            } else { alert("❌ 門號未開通"); }
        });
    }

    window.addEventListener('load', () => {
        const phone = localStorage.getItem('simba_phone');
        if (phone) {
            db.ref('users/' + phone).on('value', (s) => {
                userData = s.val();
                if(!userData) return;
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('userTierDisplay').innerText = userData.tier || "普通用戶";
                document.getElementById('userTierDisplay').className = 'tier-badge tier-' + (userData.tier === 'VIP用戶' ? 'VIP' : userData.tier === 'VVIP用戶' ? 'VVIP' : '');
                loadFolder();
            });
            // 載入公告
            db.ref('system/broadcast').on('value', (s) => {
                const b = s.val();
                if(b && b.text) {
                    document.getElementById('marqueeArea').style.display = 'flex';
                    document.getElementById('marqueeText').innerText = b.text;
                    marqueeLink = b.link;
                }
            });
        } else { document.getElementById('lock-screen').style.display = 'flex'; }
        setTimeout(() => document.getElementById('splash-screen').style.opacity = '0', 1000);
        loadProfile();
    });

    // --- 2. 客戶資料夾雲端化 ---
    async function saveClientData(type) {
        const phone = localStorage.getItem('simba_phone');
        const cName = document.getElementById(type === 'sell' ? 'clientNameSell' : 'clientNameBuy').value;
        if(!cName) { alert("請填寫客戶稱呼"); return; }

        const limit = userData.tier === 'VIP用戶' ? 100 : (userData.tier === 'VVIP用戶' ? 9999 : 5);
        const currentCount = userData.customers ? Object.keys(userData.customers).length : 0;

        if (currentCount >= limit) { alert(`❌ 已達儲存上限(${limit}個)，請付費升級。`); return; }

        const data = type === 'sell' ? sellResult : buyResult;
        if(!data) { alert("請先進行計算"); return; }

        const timestamp = Date.now();
        // 儲存至用戶資料夾
        db.ref(`users/${phone}/customers/${timestamp}`).set({ name: cName, type, data, date: new Date().toLocaleDateString() });
        // 同步發送一份到 Simba 的後台理 (潛在買方雷達)
        db.ref(`admin/leads/${phone}_${timestamp}`).set({ agent: userData.name, client: cName, type, data });

        alert("✅ 已成功儲存至雲端資料夾");
        loadFolder();
    }

    function loadFolder() {
        const list = document.getElementById('clientList');
        list.innerHTML = "";
        if(!userData.customers) return;
        Object.keys(userData.customers).forEach(key => {
            const c = userData.customers[key];
            list.innerHTML += `<div class="client-item"><div><b>${c.name}</b> (${c.type==='sell'?'售':'購'})</div><button onclick="viewCloudClient('${key}')" class="btn-main" style="padding:5px 12px; font-size:0.8rem;">查看</button></div>`;
        });
        const limit = userData.tier === 'VIP用戶' ? 100 : (userData.tier === 'VVIP用戶' ? '無限' : 5);
        document.getElementById('limitDisplay').innerText = `儲存上限：${Object.keys(userData.customers).length} / ${limit}`;
    }

    // --- 3. 一鍵分享圖卡 ---
    async function shareAsImage() {
        const canvas = await html2canvas(document.querySelector("#captureArea"), { useCORS: true, scale: 2 });
        canvas.toBlob(blob => {
            const file = new File([blob], "report.png", { type: "image/png" });
            if (navigator.share) {
                navigator.share({ files: [file], title: '房產財務分析報告' });
            } else { alert("您的裝置不支援直接分享，請長按圖片儲存。"); }
        });
    }

    // --- 4. 管理員功能 ---
    function triggerAdmin() {
        if(prompt("請輸入管理員暗號：") === 'Simba') document.getElementById('adminPanel').style.display = 'block';
    }

    function addUser() {
        const p = document.getElementById('admin_phone').value;
        const n = document.getElementById('admin_name').value;
        const t = document.getElementById('admin_tier').value;
        db.ref('users/' + p).set({ name: n, status: 'active', tier: t });
        alert(`✅ ${n} 已開通為 ${t}`);
    }

    function updateSystem() {
        const t = document.getElementById('admin_msg').value;
        const l = document.getElementById('admin_link').value;
        db.ref('system/broadcast').set({ text: t, link: l });
        alert("✅ 公告已更新");
    }

    // --- (原有計算邏輯：doSell, doBuy, doPK 保持不變，但加入服務費寫死 4% 與 2%) ---
    function doSell() {
        const bP = parseFloat(document.getElementById('sell_buyP').value)||0, sP = parseFloat(document.getElementById('sell_sellP').value)||0;
        const loan = parseFloat(document.getElementById('sell_loanL').value)||0, bD = document.getElementById('sell_buyDate').value;
        if(!bP || !sP || !bD) return;
        let fee = sP * 0.04, misc = sP * 0.01, profit = sP - bP - misc - fee;
        let tax = (new Date(bD) >= new Date('2016-01-01')) ? Math.max(0, profit) * 0.45 : 0;
        let cash = sP - loan - tax - misc - fee;
        sellResult = { sP, profit, tax, cash: Math.round(cash), fee, misc };
        document.getElementById('areaS').style.display = 'block';
        document.getElementById('outC').innerText = Math.round(cash) + " 萬";
    }

    function doBuy() {
        const rate = parseFloat(document.getElementById('buy_rate').value)/100, grace = parseInt(document.getElementById('buy_grace').value);
        const ltv = parseFloat(document.getElementById('buy_ltv').value), miscRate = 0.05; // 3%規費 + 2%服務費
        let fP = 0, rC = 0, fL = 0;
        if (currentBuyMode === 'budget') {
            const cash = parseFloat(document.getElementById('buy_cash').value)||0, monthly = parseFloat(document.getElementById('buy_monthly').value)*10000||0;
            fP = Math.min(cash / (1 - ltv + miscRate), monthly / 0.004 / ltv / 10000); fL = fP * ltv; rC = (fP * (1 - ltv)) + (fP * miscRate);
        } else {
            fP = parseFloat(document.getElementById('buy_target').value)||0; fL = fP * ltv; rC = (fP * (1 - ltv)) + (fP * miscRate);
        }
        buyResult = { fP: Math.round(fP), fL: Math.round(fL), rC: Math.round(rC), nPay: Math.round(fL * 40), mode: currentBuyMode };
        document.getElementById('areaB').style.display = 'block';
        document.getElementById('resBuyVal').innerText = (currentBuyMode === 'budget' ? buyResult.fP : buyResult.rC) + " 萬";
    }

    function showShareCard(type) {
        const clientName = document.getElementById(type === 'sell' ? 'clientNameSell' : 'clientNameBuy').value || "客戶";
        document.getElementById('cardClientName').innerText = clientName + " 專屬";
        const bc = document.getElementById('cardBodyContent');
        if (type === 'sell') {
            bc.innerHTML = `<div class="share-hero-box"><span style="font-size:0.8rem;">實拿現金</span><div class="share-hero-val">$ ${sellResult.cash} 萬</div></div><div class="share-detail-row"><span>服務費(4%)</span><span>${Math.round(sellResult.fee)} 萬</span></div>`;
        } else {
            bc.innerHTML = `<div class="share-hero-box"><span style="font-size:0.8rem;">建議總價</span><div class="share-hero-val">${buyResult.fP} 萬</div></div><div class="share-detail-row"><span>預備金(含2%服務費)</span><span>${Math.round(buyResult.fP*0.05)} 萬</span></div>`;
        }
        document.getElementById('shareCardModal').style.display = 'flex';
    }

    function switchTab(id, el) { document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); el.classList.add('active'); }
    function setBuyMode(m) { currentBuyMode = m; document.getElementById('btnModeB').classList.toggle('active', m === 'budget'); document.getElementById('btnModeT').classList.toggle('active', m === 'target'); document.getElementById('groupBudget').style.display = m === 'budget' ? 'block' : 'none'; document.getElementById('groupTarget').style.display = m === 'target' ? 'block' : 'none'; }
    function loadProfile() { const s = JSON.parse(localStorage.getItem('simbaProfile') || '{}'); document.getElementById('agentName').value=s.name||''; document.getElementById('agentPhone').value=s.phone||''; document.getElementById('cardAgentName').innerText=s.name||'房產顧問'; document.getElementById('cardAgentPhone').innerText=s.phone||'--'; }
    function saveProfile() { const p = { name: document.getElementById('agentName').value, phone: document.getElementById('agentPhone').value }; localStorage.setItem('simbaProfile', JSON.stringify(p)); location.reload(); }
</script>
</body>
</html>
