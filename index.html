<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>房產財務精算師 Premium</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #007AFF;
            --primary-gradient: linear-gradient(135deg, #007AFF, #5856D6);
            --bg-body: #F2F2F7;
            --surface: #FFFFFF;
            --text-main: #1D1D1F;
            --radius-l: 24px;
            --nav-height: 75px;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); margin: 0; color: var(--text-main); padding-bottom: calc(var(--nav-height) + 40px); user-select: none; overflow-x: hidden; }
        
        /* --- 啟動與鎖定 --- */
        #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary-gradient); z-index: 11000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s; }
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 122, 255, 0.96); backdrop-filter: blur(25px); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
        .lock-content { background: white; padding: 40px 30px; border-radius: 28px; text-align: center; width: 100%; max-width: 360px; box-shadow: 0 30px 60px rgba(0,0,0,0.1); }
        .lock-title { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 20px; }
        .lock-input { width: 100%; padding: 16px; font-size: 1.1rem; text-align: center; border: 2.5px solid #F2F2F7; border-radius: 16px; margin-bottom: 20px; font-weight: bold; color: var(--primary); letter-spacing: 1px; }
        .lock-btn { background: var(--primary); color: white; width: 100%; padding: 16px; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }

        header { background: var(--primary-gradient); color: white; height: 60px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: center; }
        h1 { font-size: 1.1rem; margin: 0; font-weight: 800; }
        
        .container { width: 100%; padding: 20px 15px; margin: 0 auto; max-width: 650px; }
        .card { background: white; border-radius: var(--radius-l); padding: 30px 20px; box-shadow: 0 4px 25px rgba(0,0,0,0.04); margin-bottom: 25px; }
        h2 { font-size: 1.15rem; margin: 0 0 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        h2::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }

        .mode-toggle { display: flex; background: #F2F2F7; border-radius: 14px; padding: 5px; margin-bottom: 25px; }
        .toggle-btn { flex: 1; text-align: center; padding: 12px; font-size: 0.95rem; font-weight: 700; color: #8E8E93; border-radius: 11px; cursor: pointer; }
        .toggle-btn.active { background: white; color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }

        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .form-group label { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; color: #444; margin-bottom: 6px; }
        input, select { width: 100%; padding: 14px 15px; border: 1.5px solid #E5E5EA; border-radius: 14px; font-size: 1.05rem; background: #FAFAFA; transition: 0.2s; -webkit-appearance: none; }

        .check-item { display: flex; align-items: center; padding: 15px; background: #F9F9FB; border-radius: 14px; border: 1.5px solid #EEE; margin-top: 10px; cursor: pointer; }
        .check-item.active { background: #E5F1FF; border-color: var(--primary); }
        .check-box { width: 22px; height: 22px; border: 2px solid #CCC; border-radius: 6px; margin-right: 12px; display: flex; align-items: center; justify-content: center; background: white; }
        .check-item.active .check-box { background: var(--primary); border-color: var(--primary); }
        .check-box::after { content: '✓'; color: white; font-size: 14px; font-weight: bold; display: none; }
        .check-item.active .check-box::after { display: block; }

        .btn-group { display: flex; gap: 12px; margin-top: 30px; flex-direction: column; }
        button { width: 100%; padding: 18px; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        .btn-main { background: var(--primary); color: white; box-shadow: 0 8px 25px rgba(0,122,255,0.25); }
        .btn-gold { background: white; border: 2.5px solid var(--primary); color: var(--primary); }

        .res-area { margin-top: 35px; display: none; }
        .res-card { background: var(--primary-gradient); border-radius: 24px; padding: 30px 20px; color: white; text-align: center; }
        .res-val { font-size: 2.5rem; font-weight: 900; }
        .res-explain { background: #E5F1FF; color: #0056B3; padding: 15px; border-radius: 15px; margin-top: 15px; font-size: 0.85rem; line-height: 1.6; font-weight: 600; }

        /* --- 報表彈出視窗 (修正 iPad 與全格式) --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20000; overflow-y: auto; flex-direction: column; align-items: center; padding: 40px 15px; }
        .share-card { width: 100%; max-width: 400px; background: white; border-radius: 35px; overflow: hidden; flex-shrink: 0; box-shadow: 0 40px 80px rgba(0,0,0,0.4); }
        .share-header { background: var(--primary-gradient); padding: 35px 25px; color: white; text-align: center; }
        .share-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 5px; }
        .share-body { padding: 30px 25px; color: #1D1D1F; }
        .share-hero-box { background: #F2F2F7; border-radius: 24px; padding: 25px 15px; margin: 25px; text-align: center; }
        .share-hero-val { font-size: 2.3rem; font-weight: 900; color: #007AFF; }
        .share-detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #EEE; font-size: 0.95rem; }
        .share-footer { background: #f9f9fb; padding: 20px 25px; display: flex; align-items: center; gap: 15px; border-top: 1px solid #eee; }
        .share-avatar { width: 55px; height: 55px; border-radius: 50%; border: 2.5px solid #007AFF; object-fit: cover; }
        .share-license { font-size: 0.65rem; color: #CCC; text-align: center; padding: 15px; background: #f9f9fb; border-top: 1px solid #F2F2F7; letter-spacing: 1px; }
        .modal-close-btn { background: white; color: #007AFF; padding: 18px 0; width: 100%; max-width: 320px; border-radius: 40px; border: none; font-weight: 900; font-size: 1.15rem; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin: 30px 0 60px; flex-shrink: 0; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-top: 1px solid #EEE; display: flex; justify-content: space-around; align-items: center; z-index: 999; }
        .nav-item { flex: 1; text-align: center; color: #8E8E93; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<div id="splash-screen"><img src="image_24505e.png" style="width:100px;"><div style="color:white; font-weight:900; margin-top:15px;">房產精算師 PREMIUM</div></div>

<div id="lock-screen"><div class="lock-content"><div class="lock-title">雲端授權驗證</div><p style="font-size:0.85rem; color:#8E8E93; margin-bottom:20px;">請輸入開通授權的手機號碼</p><input type="text" id="passcodeInput" class="lock-input" placeholder="09xx-xxx-xxx"><button onclick="checkCloudAuth()" class="lock-btn">驗證並登入</button></div></div>

<header><h1>房產財務精算師</h1></header>

<div class="container">
    <div id="tab-sell" class="tab-content active">
        <div class="card">
            <h2>💰 售屋獲利精算</h2>
            <div class="grid">
                <div class="form-group"><label>取得日期</label><input type="date" id="sell_buyDate"></div>
                <div class="form-group"><label>買入價格 (萬)</label><input type="number" id="sell_buyP"></div>
                <div class="form-group"><label>預計賣價 (萬)</label><input type="number" id="sell_sellP"></div>
                <div class="form-group"><label>房貸餘額 (萬)</label><input type="number" id="sell_loanL"></div>
                <div class="form-group"><label>服務費率 (%)</label><select id="sell_fee"><option value="0.04">4 %</option><option value="0.03">3 %</option><option value="0.02">2 %</option><option value="0">免收</option></select></div>
                <div class="check-item" id="item_isSelf" onclick="toggleCheck('isSelf')"><div class="check-box"></div><div class="check-label">符合自住 6 年免稅 (400萬額度)</div></div>
                <div class="check-item" id="item_isRefund" onclick="toggleCheck('isRefund')"><div class="check-box"></div><div class="check-label">擬使用「重購退稅」</div></div>
                <div id="boxRefund" style="display:none; padding:15px; background:#F2F2F7; border-radius:14px; margin-top:10px;"><div class="form-group"><label>新購屋總價 (萬)</label><input type="number" id="sell_newP" placeholder="計算退稅額用"></div></div>
            </div>
            <div class="btn-group"><button onclick="doSell()" class="btn-main">📊 開始計算獲利</button><button onclick="showShareCard('sell')" class="btn-outline">✨ 製作財務報表</button></div>
            <div id="areaS" class="res-area"><div class="res-card"><div style="opacity:0.8; font-size:0.9rem;">預估實拿現金 (稅後)</div><div class="res-val" id="outC">0 萬</div></div></div>
        </div>
    </div>

    <div id="tab-buy" class="tab-content">
        <div class="card">
            <h2>🏠 購屋能力評估</h2>
            <div class="mode-toggle"><div id="btnModeB" class="toggle-btn active" onclick="setBuyMode('budget')">用預算推</div><div id="btnModeT" class="toggle-btn" onclick="setBuyMode('target')">由總價推</div></div>
            <div class="grid">
                <div id="groupBudget">
                    <div class="form-group"><label>手上可用現金 (萬)</label><input type="number" id="buy_cash" placeholder="300"></div>
                    <div class="form-group" style="margin-top:10px;"><label>每月還款預算 (萬)</label><input type="number" id="buy_monthly" placeholder="3"></div>
                </div>
                <div id="groupTarget" style="display:none;">
                    <div class="form-group"><label>房屋目標總價 (萬)</label><input type="number" id="buy_target" placeholder="1000"></div>
                </div>
                <div style="border-top:1px dashed #EEE; padding-top:15px;"></div>
                <div class="form-group"><label>房貸利率 (%)</label><select id="buy_rateSelect" onchange="updateRate()"><option value="2.5" selected>2.5 %</option><option value="2.75">2.75 %</option><option value="3.0">3.0 %</option><option value="custom">自定義...</option></select><input type="number" id="buy_rateCustom" value="2.5" step="0.01" style="display:none; margin-top:10px;"></div>
                <div class="form-group"><label>寬限期 (年)</label><select id="buy_grace"><option value="0">無寬限期</option><option value="3">3 年</option><option value="5">5 年</option></select></div>
                <div class="form-group"><label>貸款成數</label><select id="buy_ltv"><option value="0.7">7 成</option><option value="0.75" selected>7.5 成</option><option value="0.8">8 成</option></select></div>
                <div class="form-group"><label>買方服務費 (%)</label><select id="buy_fee"><option value="0.02" selected>2 %</option><option value="0.01">1 %</option><option value="0">免收</option></select></div>
            </div>
            <div class="btn-group"><button onclick="doBuy()" class="btn-main">🔍 進行財務評估</button><button onclick="showShareCard('buy')" class="btn-gold">✨ 製作財務報表</button></div>
            <div id="areaB" class="res-area">
                <div class="res-card"><div id="resBuyLabel" style="opacity:0.8; font-size:0.9rem;">建議購屋總價</div><div class="res-val" id="resBuyVal">0 萬</div></div>
                <div id="resExplain" class="res-explain"></div>
            </div>
        </div>
    </div>

    <div id="tab-pk" class="tab-content"><div class="card"><h2>⚖️ 租房 vs 買房對決</h2><div class="grid"><div class="form-group"><label>房屋總價 (萬)</label><input type="number" id="pkPrice"></div><div class="form-group"><label>每月租金 (元)</label><input type="number" id="pkRent"></div></div><button onclick="doPK()" class="btn-main" style="margin-top:20px; background:orange;">🥊 開始資產對決</button><div id="areaPK" style="display:none; margin-top:25px;"><div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;"><div style="background:#FFF5F5; padding:20px 10px; border-radius:20px; text-align:center;"><span style="color:#EF4444; font-size:0.85rem; font-weight:700;">10年租金支出</span><div id="resRent" style="font-size:1.3rem; font-weight:900; color:#EF4444; margin-top:5px;">0 萬</div></div><div style="background:#F0FDF4; padding:20px 10px; border-radius:20px; text-align:center;"><span style="color:#22C55E; font-size:0.85rem; font-weight:700;">10年預估增值</span><div id="resGain" style="font-size:1.3rem; font-weight:900; color:#22C55E; margin-top:5px;">0 萬</div></div></div></div></div></div>
    <div id="tab-settings" class="tab-content"><div class="card"><h2>👤 品牌設定</h2><div style="text-align:center; margin-bottom:30px;"><div style="width:120px; height:120px; margin:0 auto; overflow:hidden; border-radius:50%; border:3px solid var(--primary); cursor:pointer;" onclick="document.getElementById('profileImgInput').click()"><img id="profilePreview" src="image_24505e.png" style="width:100%; height:100%; object-fit:cover;"></div><input type="file" id="profileImgInput" accept="image/*" style="display:none;" onchange="handleProfileUpload(this)"></div><div class="grid"><input type="text" id="agentName" placeholder="姓名 / 職稱"><input type="text" id="agentPhone" placeholder="聯絡電話"><input type="text" id="agentSlogan" placeholder="專業座右銘"></div><button onclick="saveProfile()" class="btn-main" style="margin-top:25px;">💾 儲存並更新</button></div></div>
</div>

<nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('tab-sell', this)">💰 售屋</div>
    <div class="nav-item" onclick="switchTab('tab-buy', this)">🏠 購屋</div>
    <div class="nav-item" onclick="switchTab('tab-pk', this)">⚖️ PK</div>
    <div class="nav-item" onclick="switchTab('tab-settings', this)">👤 設定</div>
</nav>

<div id="shareCardModal" class="modal">
    <div class="share-card">
        <div class="share-header"><div class="share-title">不動產財務分析報告</div><div style="font-size:0.7rem; opacity:0.8;">PREMIUM FINANCIAL REPORT</div></div>
        <div class="share-body" id="cardBodyContent"></div>
        <div class="share-footer"><img id="cardAgentImg" class="share-avatar" src=""><div class="share-info"><div class="share-name" id="cardAgentName">專業顧問</div><div id="cardAgentSlogan" style="color:#86868b; font-size:0.8rem;"></div><div class="share-contact" id="cardAgentPhone" style="color:#555; font-size:0.9rem; font-weight:700;">--</div></div></div>
        <div id="licenseFooter" class="share-license"></div>
    </div>
    <button class="modal-close-btn" onclick="document.getElementById('shareCardModal').style.display='none'">關閉報表內容</button>
</div>

<script>
    // --- Firebase 配置 ---
    const firebaseConfig = {
        apiKey: "AIzaSyDv3-2psunhNzjbTIY38L8jbVf2wmO5WEw",
        authDomain: "simbaapp-62d40.firebaseapp.com",
        databaseURL: "https://simbaapp-62d40-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "simbaapp-62d40",
        storageBucket: "simbaapp-62d40.firebasestorage.app",
        messagingSenderId: "579331559085",
        appId: "1:579331559085:web:4d6e4ab3605f124ae1c024",
        measurementId: "G-QJFE2LZYCB"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let sellResult = null, buyResult = null, currentBuyMode = 'budget';
    const checks = { isSelf: false, isRefund: false };

    // --- 極簡解鎖：只需手機號碼 ---
    async function checkCloudAuth() {
        const phone = document.getElementById('passcodeInput').value.trim();
        if (!phone) { alert("❌ 請輸入手機號碼"); return; }
        db.ref('users/' + phone).once('value', (s) => {
            const d = s.val();
            if (d && d.status === 'active') {
                localStorage.setItem('simba_premium_unlocked', 'true');
                localStorage.setItem('simba_license_phone', phone);
                localStorage.setItem('simba_user_name', d.name);
                location.reload();
            } else { alert("❌ 此門號未獲得授權，請聯繫管理員開通。"); }
        });
    }

    window.addEventListener('load', () => {
        setTimeout(() => { document.getElementById('splash-screen').style.opacity = '0'; setTimeout(() => document.getElementById('splash-screen').style.display='none', 800); }, 1500);
        if (localStorage.getItem('simba_premium_unlocked') === 'true') { document.getElementById('lock-screen').style.display = 'none'; }
        else { document.getElementById('lock-screen').style.display = 'flex'; }
        loadProfile();
    });

    function toggleCheck(id) {
        checks[id] = !checks[id];
        document.getElementById('item_' + id).classList.toggle('active', checks[id]);
        if(id === 'isRefund') document.getElementById('boxRefund').style.display = checks[id] ? 'block' : 'none';
    }

    function doSell() {
        const bP = parseFloat(document.getElementById('sell_buyP').value)||0, sP = parseFloat(document.getElementById('sell_sellP').value)||0;
        const loan = parseFloat(document.getElementById('sell_loanL').value)||0, bD = document.getElementById('sell_buyDate').value;
        const feeRate = parseFloat(document.getElementById('sell_fee').value);
        if(!bP || !sP || !bD) { alert("⚠️ 請完整填寫資訊"); return; }
        let fee = sP * feeRate, misc = sP * 0.01;
        let profit = sP - bP - misc - fee;
        let tax = 0;
        if (new Date(bD) >= new Date('2016-01-01')) {
            let taxable = checks.isSelf ? Math.max(0, profit - 400) : profit;
            tax = taxable * (checks.isSelf ? 0.1 : 0.45);
        }
        let refund = 0;
        if (checks.isRefund) {
            const newP = parseFloat(document.getElementById('sell_newP').value)||0;
            refund = newP >= sP ? tax : tax * (newP / sP);
        }
        let cash = sP - loan - (tax - refund) - misc - fee;
        sellResult = { sP, profit, tax, refund, cash, fee, misc };
        document.getElementById('areaS').style.display = 'block';
        document.getElementById('outC').innerText = Math.round(cash) + " 萬";
    }

    function setBuyMode(m) {
        currentBuyMode = m;
        document.getElementById('btnModeB').classList.toggle('active', m === 'budget');
        document.getElementById('btnModeT').classList.toggle('active', m === 'target');
        document.getElementById('groupBudget').style.display = m === 'budget' ? 'block' : 'none';
        document.getElementById('groupTarget').style.display = m === 'target' ? 'block' : 'none';
        document.getElementById('areaB').style.display = 'none';
    }

    function updateRate() { document.getElementById('buy_rateCustom').style.display = document.getElementById('buy_rateSelect').value === 'custom' ? 'block' : 'none'; }

    function doBuy() {
        const rate = (document.getElementById('buy_rateSelect').value === 'custom' ? parseFloat(document.getElementById('buy_rateCustom').value) : parseFloat(document.getElementById('buy_rateSelect').value)) / 100;
        const grace = parseInt(document.getElementById('buy_grace').value), ltv = parseFloat(document.getElementById('buy_ltv').value), feeRate = parseFloat(document.getElementById('buy_fee').value);
        const rM = rate / 12, pM = (30 - grace) * 12, fact = (Math.pow(1 + rM, pM) * rM) / (Math.pow(1 + rM, pM) - 1);
        const miscRate = 0.03 + feeRate; 

        let fP = 0, fL = 0, rC = 0, cashLeft = 0;
        if (currentBuyMode === 'budget') {
            const cash = parseFloat(document.getElementById('buy_cash').value)||0, monthly = parseFloat(document.getElementById('buy_monthly').value)*10000||0;
            if(!cash || !monthly) return;
            let pByCash = cash / (1 - ltv + miscRate), pByMonthly = monthly / fact / ltv / 10000;
            fP = Math.min(pByCash, pByMonthly); fL = fP * ltv; rC = (fP * (1 - ltv)) + (fP * miscRate); cashLeft = cash - rC;
            document.getElementById('resBuyLabel').innerText = "建議購屋總價";
            document.getElementById('resBuyVal').innerText = Math.round(fP) + " 萬";
            document.getElementById('resExplain').innerText = `💡 數據分析：最高能支持 ${Math.round(fP)} 萬總價。此方案需投入 ${Math.round(rC)} 萬現金，您還有 ${Math.round(cashLeft)} 萬剩餘資金。`;
        } else {
            fP = parseFloat(document.getElementById('buy_target').value)||0; if(!fP) return;
            fL = fP * ltv; rC = (fP * (1 - ltv)) + (fP * miscRate);
            document.getElementById('resBuyLabel').innerText = "需準備總現金";
            document.getElementById('resBuyVal').innerText = Math.round(rC) + " 萬";
            document.getElementById('resExplain').innerText = `💡 數據分析：總價 ${fP} 萬房屋，頭期款需 ${Math.round(fP*(1-ltv))} 萬，加上約 ${Math.round(fP*miscRate)} 萬的服務費與雜支，共需準備 ${Math.round(rC)} 萬。`;
        }
        buyResult = { fP:Math.round(fP), fL:Math.round(fL), rC:Math.round(rC), nPay:Math.round(fL*10000*fact), iPay:Math.round(fL*10000*rM), grace, ltv:ltv*10, rate:(rate*100).toFixed(2), mode:currentBuyMode, fee:Math.round(fP*feeRate), misc:Math.round(fP*0.03) };
        document.getElementById('areaB').style.display = 'block';
    }

    function doPK() {
        const p = parseFloat(document.getElementById('pkPrice').value)||0, r = parseFloat(document.getElementById('pkRent').value)||0;
        document.getElementById('areaPK').style.display = 'block';
        document.getElementById('resRent').innerText = Math.round(r * 120 / 10000) + " 萬";
        document.getElementById('resGain').innerText = Math.round(p * 0.34) + " 萬";
    }

    function showShareCard(type) {
        const s = JSON.parse(localStorage.getItem('simbaProfile_v18') || '{}');
        const lp = localStorage.getItem('simba_license_phone') || "";
        const u = localStorage.getItem('simba_user_name') || "專業人員";
        const bc = document.getElementById('cardBodyContent');
        document.getElementById('cardAgentName').innerText = s.name || "專業顧問";
        document.getElementById('cardAgentPhone').innerText = s.phone || lp;
        document.getElementById('cardAgentSlogan').innerText = s.slogan || "";
        document.getElementById('cardAgentImg').src = s.img || "image_24505e.png";
        let h = '';
        if (type === 'sell' && sellResult) {
            h = `<div class="share-hero-box"><span style="font-size:0.8rem;color:#666;">預估實拿現金 (稅後)</span><div class="share-hero-val">$ ${sellResult.cash} 萬</div></div><div class="share-detail-row"><span>稅後淨利估算</span><span style="color:#007AFF;font-weight:bold;">+${Math.round(sellResult.profit)} 萬</span></div><div class="share-detail-row"><span>服務費 + 雜支</span><span>${Math.round(sellResult.fee+sellResult.misc)} 萬</span></div>`;
        } else if (type === 'buy' && buyResult) {
            let label = buyResult.mode==='target'?'需準備總現金':'建議購屋總價';
            let val = buyResult.mode==='target'?buyResult.rC:buyResult.fP;
            h = `<div class="share-hero-box"><span style="font-size:0.8rem;color:#666;">${label}</span><div class="share-hero-val">${val} 萬</div><div style="font-size:0.7rem;color:#999;margin-top:10px;">(含頭期、${buyResult.fee}萬服務費及${buyResult.misc}萬規費)</div></div><div class="share-detail-row"><span>本息攤還月付</span><span style="color:#007AFF;font-weight:bold;">${buyResult.nPay.toLocaleString()} 元</span></div>${buyResult.grace>0?`<div class="share-detail-row"><span>寬限期月付</span><span style="color:#007AFF;">${buyResult.iPay.toLocaleString()} 元</span></div>`:''}`;
        }
        bc.innerHTML = h;
        document.getElementById('licenseFooter').innerText = `【本報表由 ${u} 授權產出 (ID: ${lp.slice(-4)})】`;
        document.getElementById('shareCardModal').style.display = 'flex';
    }

    function switchTab(id, el) { document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); el.classList.add('active'); }
    function handleProfileUpload(i) { if (i.files && i.files[0]) { const r = new FileReader(); r.onload = (e) => { document.getElementById('profilePreview').src = e.target.result; }; r.readAsDataURL(i.files[0]); } }
    function saveProfile() { const p = { name: document.getElementById('agentName').value, phone: document.getElementById('agentPhone').value, slogan: document.getElementById('agentSlogan').value, img: document.getElementById('profilePreview').src }; localStorage.setItem('simbaProfile_v18', JSON.stringify(p)); alert('✅ 品牌設定已儲存'); }
    function loadProfile() { const s = JSON.parse(localStorage.getItem('simbaProfile_v18') || '{}'); document.getElementById('agentName').value=s.name||''; document.getElementById('agentPhone').value=s.phone||''; document.getElementById('agentSlogan').value=s.slogan||''; if(s.img) document.getElementById('profilePreview').src=s.img; }
</script>
</body>
</html>
