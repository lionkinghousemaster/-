<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>房產財務精算師 Premium</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #007AFF;
            --primary-dark: #0056b3;
            --bg-sky: linear-gradient(180deg, #e0f2fe 0%, #f5f7fa 100%);
            --surface: #ffffff;
            --text-main: #1d1d1f;
            --radius-l: 24px;
            --nav-height: 75px;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-sky); margin: 0; padding: 0; color: var(--text-main); padding-bottom: calc(var(--nav-height) + 40px); user-select: none; min-height: 100vh; }
        
        /* --- 鎖定畫面 --- */
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
        .lock-content { background: white; padding: 40px 30px; border-radius: 32px; text-align: center; width: 100%; max-width: 360px; box-shadow: 0 30px 60px rgba(0,122,255,0.1); border: 1px solid #e0f2fe; }
        .lock-title { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 25px; }
        .lock-input { width: 100%; padding: 18px; font-size: 1.2rem; text-align: center; border: 2px solid #f2f2f7; border-radius: 16px; margin-bottom: 20px; font-weight: bold; color: var(--primary); }
        .lock-btn { background: linear-gradient(135deg, #007AFF, #5856D6); color: white; width: 100%; padding: 18px; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }

        /* --- Header --- */
        header { background: white; padding: 0 20px; height: 65px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; border-bottom: 1px solid #eef2f6; }
        h1 { margin: 0; font-weight: 800; font-size: 1.2rem; color: var(--primary); }

        /* --- 主佈局 --- */
        .container { width: 100%; padding: 20px 15px; margin: 0 auto; max-width: 700px; }
        .card { background: white; border-radius: var(--radius-l); padding: 30px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.02); margin-bottom: 25px; border: 1px solid rgba(0,122,255,0.05); }
        h2 { font-size: 1.2rem; color: #333; margin: 0 0 25px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        
        .mode-toggle { display: flex; background: #f2f2f7; border-radius: 14px; padding: 5px; margin-bottom: 25px; }
        .toggle-btn { flex: 1; text-align: center; padding: 12px; font-size: 0.95rem; font-weight: 700; color: #8e8e93; border-radius: 11px; cursor: pointer; }
        .toggle-btn.active { background: white; color: var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .form-group label { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 700; color: #555; margin-bottom: 8px; }
        input, select { width: 100%; padding: 16px; border: 1.5px solid #eef2f6; border-radius: 16px; font-size: 1.05rem; background: #fafafa; transition: 0.2s; }
        input:focus { border-color: var(--primary); background: white; outline: none; }

        /* --- 按鈕 --- */
        .btn-group { display: flex; gap: 12px; margin-top: 30px; flex-direction: column; }
        button { width: 100%; padding: 18px; border: none; border-radius: 18px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn-main { background: linear-gradient(135deg, #007AFF, #5856D6); color: white; box-shadow: 0 8px 25px rgba(0,122,255,0.2); }
        .btn-outline { background: white; border: 2px solid var(--primary); color: var(--primary); }

        /* --- 報表 Modal --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 20000; overflow-y: auto; flex-direction: column; align-items: center; padding: 40px 15px; }
        .share-card { width: 100%; max-width: 400px; background: white; border-radius: 32px; overflow: hidden; box-shadow: 0 40px 80px rgba(0,0,0,0.3); }
        .share-header { background: linear-gradient(135deg, #007AFF, #5856D6); padding: 40px 25px; color: white; text-align: center; }
        .share-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 5px; }
        .share-body { padding: 30px 25px; color: #1d1d1f; }
        .share-hero-box { background: #f2f2f7; border-radius: 24px; padding: 25px 15px; margin-bottom: 25px; text-align: center; }
        .share-hero-val { font-size: 2.5rem; font-weight: 900; color: var(--primary); }
        .share-detail-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #f2f2f7; font-size: 1rem; }
        .share-footer { background: #f9f9fb; padding: 25px; display: flex; align-items: center; gap: 15px; border-top: 1px solid #eee; }
        .share-avatar { width: 55px; height: 55px; border-radius: 50%; border: 2.5px solid var(--primary); object-fit: cover; }
        .share-license { font-size: 0.7rem; color: #ccc; text-align: center; padding: 20px; background: #f9f9fb; letter-spacing: 1px; }
        .modal-close-btn { background: white; color: var(--primary); padding: 18px 60px; border-radius: 40px; border: none; font-weight: 900; font-size: 1.1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin: 30px 0 60px; }

        /* --- 底部導航 --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; z-index: 999; padding-bottom: 10px; }
        .nav-item { flex: 1; text-align: center; color: #8e8e93; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
        .nav-item.active { color: var(--primary); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<div id="splash-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(135deg, #007AFF, #5856D6); z-index:11000; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <div style="color:white; font-weight:900; letter-spacing:5px; font-size:1.2rem;">房產財務精算師</div>
</div>

<div id="lock-screen">
    <div class="lock-content">
        <div class="lock-title">雲端授權驗證</div>
        <input type="number" id="passcodeInput" class="lock-input" placeholder="請輸入註冊手機號碼">
        <button onclick="checkCloudAuth()" class="lock-btn">驗證開通</button>
        <p style="font-size:0.8rem; color:#8e8e93; margin-top:25px;">請輸入與購買時相符的手機號碼</p>
    </div>
</div>

<header>
    <h1>房產財務精算師 <small style="font-size:0.6rem; opacity:0.5;">PREMIUM</small></h1>
</header>

<div class="container">
    <div id="tab-sell" class="tab-content active">
        <div class="card">
            <h2>💰 售屋獲利分析</h2>
            <div class="grid">
                <div class="form-group"><label>取得日期</label><input type="date" id="buyDate"></div>
                <div class="form-group"><label>買入價格 (萬)</label><input type="number" id="buyP"></div>
                <div class="form-group"><label>預計賣價 (萬)</label><input type="number" id="sellP"></div>
                <div class="form-group"><label>房貸餘額 (萬)</label><input type="number" id="loanL"></div>
            </div>
            <div class="btn-group"><button onclick="doSell()" class="btn-main">開始分析</button><button onclick="showShareCard('sell')" class="btn-outline">✨ 製作財務報表</button></div>
            <div id="areaS" style="display:none; margin-top:25px; text-align:center;"><div style="background:var(--primary); color:white; padding:25px; border-radius:20px;"><div style="font-size:0.9rem; opacity:0.8;">預估實拿現金</div><div id="outC" style="font-size:2rem; font-weight:900;">0 萬</div></div></div>
        </div>
    </div>

    <div id="tab-buy" class="tab-content">
        <div class="card">
            <h2>🏠 購屋財務評估</h2>
            <div class="mode-toggle"><div id="btnModeBudget" class="toggle-btn active" onclick="setBuyMode('budget')">預算推估</div><div id="btnModeTarget" class="toggle-btn" onclick="setBuyMode('target')">總價反推</div></div>
            <div class="grid">
                <div id="inputGroupBudget"><div class="form-group"><label>手上現金 (萬) <span style="font-size:0.7rem; color:#aaa;">(含預留雜支)</span></label><input type="number" id="newC"></div><div class="form-group" style="margin-top:10px;"><label>每月還款預算 (萬)</label><input type="number" id="mP"></div></div>
                <div id="inputGroupTarget" style="display:none;"><div class="form-group"><label>目標房屋總價 (萬)</label><input type="number" id="targetPrice"></div></div>
                <div class="form-group"><label>貸款成數</label><select id="ltvRate"><option value="0.75" selected>7.5 成</option><option value="0.8">8 成</option></select></div>
            </div>
            <div class="btn-group"><button onclick="doBuy()" class="btn-main">進行評估</button><button onclick="showShareCard('buy')" class="btn-outline">✨ 製作財務報表</button></div>
            <div id="areaB" style="display:none; margin-top:25px; text-align:center;"><div style="background:var(--primary); color:white; padding:25px; border-radius:20px;"><div style="font-size:0.9rem; opacity:0.8;">建議購屋總價</div><div id="outBigVal" style="font-size:2rem; font-weight:900;">0 萬</div></div></div>
        </div>
    </div>

    <div id="tab-pk" class="tab-content">
        <div class="card">
            <h2>⚖️ 租房 vs 買房對決</h2>
            <div class="grid">
                <div class="form-group"><label>目標總價 (萬)</label><input type="number" id="pkPrice"></div>
                <div class="form-group"><label>月租金 (元)</label><input type="number" id="pkRent"></div>
            </div>
            <button onclick="doPK()" class="btn-main" style="background:linear-gradient(135deg, #FF9500, #FF5E00); margin-top:20px;">🥊 開始 10 年資產對決</button>
            <div id="areaPK" style="display:none; margin-top:25px;">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div style="background:#fff5f5; padding:20px 10px; border-radius:20px; text-align:center;"><span style="color:#ef4444; font-size:0.85rem; font-weight:700;">10年租金支出</span><div id="resRentTotal" style="font-size:1.3rem; font-weight:900; color:#ef4444;">0 萬</div></div>
                    <div style="background:#f0fdf4; padding:20px 10px; border-radius:20px; text-align:center;"><span style="color:#22c55e; font-size:0.85rem; font-weight:700;">10年預估增值</span><div id="resBuyGain" style="font-size:1.3rem; font-weight:900; color:#22c55e;">0 萬</div></div>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-settings" class="tab-content">
        <div class="card">
            <h2>👤 形象設定</h2>
            <div style="text-align:center; margin-bottom:30px;">
                <div style="width:120px; height:120px; margin:0 auto; overflow:hidden; border-radius:50%; border:4px solid var(--primary); position:relative; background:#f2f2f7; cursor:pointer;" onclick="document.getElementById('profileImgInput').click()">
                    <img id="profilePreview" src="https://i.imgur.com/8Nba9Z8.png" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <input type="file" id="profileImgInput" accept="image/*" style="display:none;" onchange="handleProfileUpload(this)">
            </div>
            <div class="grid">
                <input type="text" id="agentName" placeholder="姓名/職稱">
                <input type="text" id="agentPhone" placeholder="聯絡電話">
                <input type="text" id="agentSlogan" placeholder="專業座右銘">
            </div>
            <button onclick="saveProfile()" class="btn-main" style="margin-top:25px;">💾 儲存形象資料</button>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('tab-sell', this)">💰 售屋</div>
    <div class="nav-item" onclick="switchTab('tab-buy', this)">🏠 購屋</div>
    <div class="nav-item" onclick="switchTab('tab-pk', this)">⚖️ PK</div>
    <div class="nav-item" onclick="switchTab('tab-settings', this)">👤 設定</div>
</nav>

<div id="shareCardModal" class="modal">
    <div class="share-card">
        <div class="share-header"><div class="share-title">財務分析報告</div><div style="font-size:0.75rem; opacity:0.8; letter-spacing:2px; font-weight:700;">PREMIUM FINANCIAL REPORT</div></div>
        <div class="share-body" id="cardBodyContent"></div>
        <div class="share-footer"><img id="cardAgentImg" class="share-avatar" src=""><div class="share-info"><div class="share-name" id="cardAgentName">專業顧問</div><div id="cardAgentSlogan" style="color:#86868b; font-size:0.85rem; margin-top:2px;"></div><div class="share-contact" id="cardAgentPhone" style="color:#555; font-size:0.9rem; font-weight:700; margin-top:4px;">--</div></div></div>
        <div id="licenseFooter" class="share-license"></div>
    </div>
    <button class="modal-close-btn" onclick="document.getElementById('shareCardModal').style.display='none'">關閉報表</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDv3-2psunhNzjbTIY38L8jbVf2wmO5WEw",
        authDomain: "simbaapp-62d40.firebaseapp.com",
        databaseURL: "https://simbaapp-62d40-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "simbaapp-62d40",
        storageBucket: "simbaapp-62d40.firebasestorage.app",
        messagingSenderId: "579331559085",
        appId: "1:579331559085:web:4d6e4ab3605f124ae1c024"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let buyResult = null, sellResult = null;

    async function checkCloudAuth() {
        const phone = document.getElementById('passcodeInput').value.trim();
        if (!phone) { alert("請輸入手機號碼"); return; }
        const devId = getDeviceId();
        db.ref('users/' + phone).once('value', (s) => {
            const d = s.val();
            if (!d) { alert("❌ 無此號碼授權"); return; }
            
            // 授權邏輯：手機號碼節點存在即視為通過
            const licensedName = (typeof d === 'string') ? d : (d.name || "專業人員");

            localStorage.setItem('simba_premium_unlocked', 'true');
            localStorage.setItem('simba_license_phone', phone);
            localStorage.setItem('simba_user_name', licensedName);
            location.reload();
        });
    }

    function getDeviceId() {
        let id = localStorage.getItem('simba_device_uuid');
        if (!id) { id = 'DEV-' + Math.random().toString(36).substr(2, 9); localStorage.setItem('simba_device_uuid', id); }
        return id;
    }

    window.addEventListener('load', () => {
        setTimeout(() => { document.getElementById('splash-screen').style.opacity = '0'; setTimeout(() => document.getElementById('splash-screen').style.display='none', 800); }, 1500);
        if (localStorage.getItem('simba_premium_unlocked') === 'true') { document.getElementById('lock-screen').style.display = 'none'; }
        else { document.getElementById('lock-screen').style.display = 'flex'; }
        loadProfile();
    });

    function doSell() {
        const bP=parseFloat(document.getElementById('buyP').value)||0, sP=parseFloat(document.getElementById('sellP').value)||0, cL=parseFloat(document.getElementById('loanL').value)||0, bD = document.getElementById('buyDate').value;
        if (!bP || !sP || !bD) return;
        const profit = sP - bP;
        const cash = sP - cL - (profit * 0.45) - (sP * 0.04);
        document.getElementById('areaS').style.display='block';
        document.getElementById('outC').innerText = Math.round(cash) + " 萬";
        sellResult = { sP, profit: Math.round(profit), cash: Math.round(cash) };
    }

    function doBuy() {
        const nC=parseFloat(document.getElementById('newC').value)||0, mP=parseFloat(document.getElementById('mP').value)*10000||0, ltv=parseFloat(document.getElementById('ltvRate').value), targetP=parseFloat(document.getElementById('targetPrice').value)||0;
        let fP=0;
        if (currentBuyMode === 'budget') {
            if(!nC) return; fP = Math.min(nC/(1-ltv+0.05), mP/0.004);
        } else { fP = targetP; }
        buyResult = { fP: Math.round(fP), nPay: Math.round(fP*ltv*10000*0.004), ltv: ltv*10 };
        document.getElementById('outBigVal').innerText = buyResult.fP + " 萬";
        document.getElementById('areaB').style.display='block';
    }

    function doPK() {
        const p = parseFloat(document.getElementById('pkPrice').value)||0, r = parseFloat(document.getElementById('pkRent').value)||0;
        if(!p || !r) return;
        document.getElementById('areaPK').style.display='block';
        document.getElementById('resRentTotal').innerText = Math.round(r*120/10000) + " 萬";
        document.getElementById('resBuyGain').innerText = Math.round(p*0.34) + " 萬";
    }

    function showShareCard(type) {
        const s = JSON.parse(localStorage.getItem('simbaProfile_v18') || '{}');
        const lp = localStorage.getItem('simba_license_phone') || "";
        const bc = document.getElementById('cardBodyContent');
        const userName = localStorage.getItem('simba_user_name') || "專業人員";
        document.getElementById('cardAgentName').innerText = s.name || userName;
        document.getElementById('cardAgentPhone').innerText = s.phone || lp;
        document.getElementById('cardAgentSlogan').innerText = s.slogan || "";
        if(s.img) document.getElementById('cardAgentImg').src = s.img;
        
        let html = '';
        if (type === 'sell' && sellResult) {
            html = `<div class="share-hero-box"><span style="font-size:0.85rem;color:#666;font-weight:700;">預估實拿現金 (稅後)</span><div class="share-hero-val">$ ${sellResult.cash} 萬</div></div><div class="share-detail-row"><span>預計成交</span><span>${sellResult.sP} 萬</span></div><div class="share-detail-row"><span>稅後淨利</span><span style="color:#007AFF;font-weight:800;">+${sellResult.profit} 萬</span></div>`;
        } else if (type === 'buy' && buyResult) {
            html = `<div class="share-hero-box"><span style="font-size:0.85rem;color:#666;font-weight:700;">建議購屋總價</span><div class="share-hero-val">${buyResult.fP} 萬</div><div style="font-size:0.75rem;color:#999;margin-top:12px;">(含頭期與契稅、仲介等預留5%雜支)</div></div><div class="share-detail-row"><span>貸款成數</span><span>${buyResult.ltv} 成</span></div><div class="share-detail-row"><span>本息月付</span><span style="color:#007AFF;font-weight:800;">${buyResult.nPay.toLocaleString()} 元</span></div>`;
        }
        bc.innerHTML = html;
        document.getElementById('licenseFooter').innerText = `【本報表由 ${userName} 授權產出 (ID: ${lp.slice(-4)})】`;
        document.getElementById('shareCardModal').style.display = 'flex';
    }

    let currentBuyMode = 'budget';
    function setBuyMode(m) { currentBuyMode = m; document.getElementById('btnModeBudget').classList.toggle('active', m==='budget'); document.getElementById('btnModeTarget').classList.toggle('active', m==='target'); document.getElementById('inputGroupBudget').style.display = (m==='budget'?'block':'none'); document.getElementById('inputGroupTarget').style.display = (m==='target'?'block':'none'); }
    function switchTab(id, el) { document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); el.classList.add('active'); }
    function handleProfileUpload(i) { if (i.files && i.files[0]) { const r = new FileReader(); r.onload = (e) => { document.getElementById('profilePreview').src = e.target.result; }; r.readAsDataURL(i.files[0]); } }
    function saveProfile() { const p = { name: document.getElementById('agentName').value, phone: document.getElementById('agentPhone').value, slogan: document.getElementById('agentSlogan').value, img: document.getElementById('profilePreview').src }; localStorage.setItem('simbaProfile_v18', JSON.stringify(p)); alert('✅ 儲存成功'); }
    function loadProfile() { const s = JSON.parse(localStorage.getItem('simbaProfile_v18') || '{}'); document.getElementById('agentName').value=s.name||''; document.getElementById('agentPhone').value=s.phone||''; document.getElementById('agentSlogan').value=s.slogan||''; if(s.img) document.getElementById('profilePreview').src=s.img; }
</script>
</body>
</html>
